<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Listen to Ty deBruyn Radio. Random local playback, new music, and more.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ty deBruyn Radio">
  <meta property="og:type" content="music.radio_station">
  <meta property="og:title" content="Ty deBruyn Radio">
  <meta property="og:description" content="Listen to Ty deBruyn Radio. Random local playback, new music, and more.">
  <meta property="og:url" content="https://tydebruyn.me/radio/">
  <meta property="og:image" content="https://tydebruyn.me/radio/assets/artwork/3e1c5da5cf00f458.png">
  <meta property="og:image:alt" content="Ty deBruyn Radio artwork">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Ty deBruyn Radio">
  <meta name="twitter:description" content="Listen to Ty deBruyn Radio. Random local playback, new music, and more.">
  <meta name="twitter:image" content="https://tydebruyn.me/radio/assets/artwork/3e1c5da5cf00f458.png">
  <title>Ty deBruyn Radio</title>
  <link rel="canonical" href="https://tydebruyn.me/radio/">
  <link rel="preload" href="../Boldonse-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css?v=46">
</head>
<body>
  <main class="player" aria-labelledby="track-title">
    <section class="record-wrap" aria-label="Current track artwork">

      <div class="record" id="record" role="img" aria-label="Album artwork">
        <img id="artwork" alt="" decoding="async">
        <img id="artwork-next" alt="" decoding="async">
        <span class="record-hole" aria-hidden="true"></span>
      </div>
    </section>

    <section class="track-info" id="track-info">
      <p class="up-next" id="up-next">...</p>
      <div class="progress" aria-hidden="true">
        <span class="progress-line"><i id="progress-fill"></i></span>
      </div>
      <h1 id="track-title"><span id="track-title-text">...</span><button id="skip-button" type="button" aria-label="Skip current song">⏭</button></h1>
      <p id="artist">loading...</p>
    </section>

    <nav class="social-links" aria-label="Ty deBruyn music links">
      <a class="social-link" href="https://www.instagram.com/definitely.not.ty/" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a class="social-link" href="https://soundcloud.com/ty-debruyn" target="_blank" rel="noopener noreferrer">SoundCloud</a>
      <a class="social-link" href="https://open.spotify.com/artist/0Rsh2Yg7biqC1TWyGqCqHf" target="_blank" rel="noopener noreferrer">Spotify</a>
      <a class="social-link" href="https://music.apple.com/us/artist/ty-debruyn/6817621813" target="_blank" rel="noopener noreferrer">Apple Music</a>
      <a class="social-link" href="https://linktr.ee/tydebruyn.dj" target="_blank" rel="noopener noreferrer">Linktree</a>
    </nav>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <audio id="audio-a" preload="auto"></audio>
  </main>
  <button id="start-overlay" class="start-overlay is-hidden" type="button" aria-label="Start listening">
    <span class="is-entering start-text start-text-mobile">Tap Anywhere<br>To<br>Start Listening</span>
    <span class="is-entering start-text start-text-desktop">Click Anywhere<br>To<br>Start Listening</span>
  </button>
  <script src="playlist.js?v=4"></script>
  <script src="app.js?v=62" defer></script>
</body>
</html>
