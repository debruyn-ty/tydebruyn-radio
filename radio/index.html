<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Ty deBruyn Radio — a shared stream of carefully selected music.">
  <title>Ty deBruyn Radio</title>
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <main class="player" aria-labelledby="track-title">
    <section class="record-wrap" aria-label="Current track artwork">
      <div class="record" id="record" role="img" aria-label="Album artwork">
        <img id="artwork" alt="" decoding="async">
        <span class="record-hole" aria-hidden="true"></span>
      </div>
    </section>

    <section class="track-info">
      <div class="progress" aria-hidden="true">
        <span class="progress-line"><i id="progress-fill"></i></span>
      </div>
      <h1 id="track-title">Ty deBruyn Radio</h1>
      <p id="artist">Loading the station…</p>
    </section>

    <section class="controls" aria-label="Playback controls">
      <button id="volume-button" class="volume-button" type="button" aria-label="Show volume control" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.1-3.8v7.6a4.5 4.5 0 0 0 2.1-3.8Zm0-8.2v2.1A8 8 0 0 1 16.5 18v2.1a10 10 0 0 0 0-16.3Z"/></svg>
      </button>
      <label class="volume-slider" id="volume-control" for="volume">
        <span class="sr-only">Volume</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
      </label>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <audio id="audio" preload="auto" autoplay></audio>
  </main>
  <button id="start-overlay" class="start-overlay" type="button" aria-label="Tap anywhere to start listening">
    <span>Tap Anywhere<br>To<br>Start Listening</span>
  </button>
  <script src="playlist.js"></script>
  <script src="app.js?v=5" defer></script>
</body>
</html>
