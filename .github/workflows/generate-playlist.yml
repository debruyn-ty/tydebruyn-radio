name: Generate radio playlist

on:
  push:
    paths:
      - "mp3s/*.mp3"
      - "scripts/generate_playlist.py"
      - ".github/workflows/generate-playlist.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install mutagen
      - run: python scripts/generate_playlist.py
      - name: Commit generated playlist and artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f radio/playlist.js radio/assets/artwork
          git diff --cached --quiet || git commit -m "Generate playlist metadata"
          git push
